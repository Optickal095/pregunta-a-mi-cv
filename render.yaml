# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pregunta-a-mi-cv
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      # Secrets: Render asks for their values when the Blueprint is created.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://optickal095.github.io
